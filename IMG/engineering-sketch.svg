<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#AFC6DA" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2D5980" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B3A5C"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6A35"/>
    </marker>
  </defs>

  <!-- พื้นหลังกระดาษ + กริดแบบพิมพ์เขียว -->
  <rect x="0" y="0" width="800" height="560" fill="#F7F5F0"/>
  <rect x="0" y="0" width="800" height="560" fill="url(#grid)"/>
  <rect x="10" y="10" width="780" height="540" fill="none" stroke="#2D5980" stroke-width="1.5"/>

  <!-- หัวเรื่อง -->
  <text x="34" y="46" font-family="monospace" font-size="13" fill="#0B2238" letter-spacing="2">CONCEPT SKETCH - CIVIL ENGINEERING</text>
  <text x="34" y="66" font-family="monospace" font-size="10" fill="#8B8D8F" letter-spacing="1">STRUCTURAL ELEVATION / TRUSS BRIDGE</text>
  <rect x="640" y="26" width="130" height="26" fill="none" stroke="#FF6A35" stroke-width="1.5"/>
  <text x="705" y="43" font-family="monospace" font-size="11" fill="#FF6A35" text-anchor="middle" letter-spacing="1">A-01.1 / DETAIL</text>

  <!-- เส้นกึ่งกลาง (Centerline) -->
  <line x1="400" y1="80" x2="400" y2="420" stroke="#FF6A35" stroke-width="1" stroke-dasharray="10 4 2 4" opacity="0.6"/>
  <text x="405" y="92" font-family="monospace" font-size="10" fill="#FF6A35">CL</text>

  <!-- โครงสะพานทรัส (Truss Bridge Elevation) -->
  <g stroke="#1B3A5C" stroke-width="2.5" fill="none">
    <line x1="120" y1="300" x2="680" y2="300"/>
    <path d="M120 300 L190 230 L260 300 L330 230 L400 300 L470 230 L540 300 L610 230 L680 300"/>
    <line x1="120" y1="300" x2="120" y2="330"/>
    <line x1="680" y1="300" x2="680" y2="330"/>
  </g>
  <!-- หมุดข้อต่อ (pin joints) -->
  <g fill="#F7F5F0" stroke="#1B3A5C" stroke-width="2">
    <circle cx="120" cy="300" r="5"/><circle cx="190" cy="230" r="5"/><circle cx="260" cy="300" r="5"/>
    <circle cx="330" cy="230" r="5"/><circle cx="400" cy="300" r="5"/><circle cx="470" cy="230" r="5"/>
    <circle cx="540" cy="300" r="5"/><circle cx="610" cy="230" r="5"/><circle cx="680" cy="300" r="5"/>
  </g>
  <!-- ฐานรองรับ (supports) -->
  <g fill="#2D5980">
    <polygon points="120,330 108,352 132,352"/>
    <polygon points="680,330 668,352 692,352"/>
  </g>
  <line x1="95" y1="352" x2="145" y2="352" stroke="#2D5980" stroke-width="2"/>
  <line x1="655" y1="352" x2="705" y2="352" stroke="#2D5980" stroke-width="2"/>

  <!-- เส้นบอกระยะแนวนอน L -->
  <line x1="120" y1="392" x2="680" y2="392" stroke="#1B3A5C" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="120" y1="380" x2="120" y2="398" stroke="#1B3A5C" stroke-width="1"/>
  <line x1="680" y1="380" x2="680" y2="398" stroke="#1B3A5C" stroke-width="1"/>
  <rect x="365" y="380" width="70" height="18" fill="#F7F5F0"/>
  <text x="400" y="394" font-family="monospace" font-size="12" fill="#0B2238" text-anchor="middle">L = 6.00 m</text>

  <!-- เส้นบอกระยะแนวตั้ง H -->
  <line x1="704" y1="230" x2="704" y2="300" stroke="#1B3A5C" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="694" y1="230" x2="714" y2="230" stroke="#1B3A5C" stroke-width="1"/>
  <line x1="694" y1="300" x2="714" y2="300" stroke="#1B3A5C" stroke-width="1"/>
  <text x="722" y="269" font-family="monospace" font-size="11" fill="#0B2238">H = 1.20 m</text>

  <!-- แผนภาพแรง ΣF ที่จุดต่อกลาง -->
  <g stroke="#FF6A35" stroke-width="2" marker-end="url(#arrowOrange)">
    <line x1="400" y1="300" x2="400" y2="245"/>
    <line x1="400" y1="300" x2="445" y2="330"/>
    <line x1="400" y1="300" x2="355" y2="330"/>
  </g>
  <path d="M 380 300 A 22 22 0 0 1 400 278" fill="none" stroke="#FF6A35" stroke-width="1"/>
  <text x="330" y="270" font-family="monospace" font-size="11" fill="#FF6A35">NET F = 0</text>

  <!-- หน้าตัดคาน I-Beam (มุมล่างซ้าย) -->
  <g transform="translate(60,430)">
    <rect x="600" y="0" width="0" height="0" fill="none"/>
  </g>
  <g stroke="#1B3A5C" stroke-width="2" fill="url(#hatch)">
    <path d="M60 440 h48 v10 h-18 v40 h18 v10 h-48 v-10 h18 v-40 h-18 z"/>
  </g>
  <text x="60" y="510" font-family="monospace" font-size="10" fill="#0B2238" letter-spacing=".5">SECTION A-A</text>
  <text x="60" y="524" font-family="monospace" font-size="9" fill="#8B8D8F">STEEL I-BEAM - SCALE 1:20</text>

  <!-- วงเวียนช่างเขียนแบบ (มุมขวาล่าง) -->
  <g transform="translate(690,470)" stroke="#2D5980" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="3" fill="#2D5980"/>
    <line x1="0" y1="0" x2="-26" y2="46"/>
    <line x1="0" y1="0" x2="24" y2="46"/>
    <circle cx="24" cy="46" r="2.5" fill="#FF6A35" stroke="none"/>
  </g>

  <!-- มาตราส่วนกราฟิก (Scale bar) -->
  <g transform="translate(300,505)" font-family="monospace" font-size="9" fill="#0B2238">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#1B3A5C" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#1B3A5C" stroke-width="1.5"/>
    <line x1="60" y1="-4" x2="60" y2="4" stroke="#1B3A5C" stroke-width="1.5"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#1B3A5C" stroke-width="1.5"/>
    <text x="0" y="16" text-anchor="middle">0</text>
    <text x="60" y="16" text-anchor="middle">1</text>
    <text x="120" y="16" text-anchor="middle">2 m</text>
  </g>

  <!-- กรอบชื่อผู้ร่าง มุมล่างขวา -->
  <text x="770" y="540" font-family="monospace" font-size="9" fill="#8B8D8F" text-anchor="end">SKETCH BY P. SIRICHAREONPHAN</text>
</svg>
